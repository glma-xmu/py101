# Include INSIDE the existing HTTPS server block for maguoliang.cn.
# Keep its existing TLS certificate, static root, and other locations.
# Other copies of the course site should link to https://maguoliang.cn/live/.

location = /quiz {
    return 308 /quiz/;
}

location ^~ /quiz/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    access_log off;
}

location = /live {
    return 308 /live/;
}

location ^~ /live/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace, rather than trust, forwarding headers supplied by clients.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    proxy_request_buffering off;

    # The teacher's event stream must be delivered immediately.
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_read_timeout 75s;
    proxy_send_timeout 30s;
    access_log off;
}

location = /teacher {
    return 308 /teacher/;
}

location = /teacher/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    client_max_body_size 4k;
    client_body_buffer_size 4k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_intercept_errors off;
    access_log off;
}
