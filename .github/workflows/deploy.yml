name: Deploy course site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build site
        run: mkdocs build --site-dir ./site

      # Mirror the built site to the Aliyun server over SSH (rsync).
      # Best-effort: a server hiccup must NOT block the GitHub Pages deploy.
      # Skips itself until the SERVER_* secrets are set (see CI_MIRROR_SETUP.md).
      - name: Mirror to the Aliyun server
        continue-on-error: true
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "No SERVER_HOST secret set — skipping the mirror step."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SERVER_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=no" \
            ./site/ "$SERVER_USER@$SERVER_HOST:/opt/py101/site/"

      # Tell the personal site to rebuild, so www.maguoliang.com/teaching/py101/
      # picks up this change. That repo checks this one out and nests the built
      # site under my-new-website/teaching/py101/ — nothing built is ever
      # committed, which matters because a build is ~58 MB.
      #
      # Needs a PERSONAL_SITE_TOKEN secret: a fine-grained PAT scoped to
      # glma-xmu/personal-website with "Contents: read and write". The built-in
      # GITHUB_TOKEN cannot trigger workflows in another repository.
      # Best-effort: never block the GitHub Pages deploy. See DEPLOY.md §7.
      - name: Rebuild the personal site
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.PERSONAL_SITE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "No PERSONAL_SITE_TOKEN secret set — skipping the personal-site rebuild."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.log -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/glma-xmu/personal-website/dispatches \
            -d '{"event_type":"py101-updated"}')
          echo "repository_dispatch -> HTTP $code"
          if [ "$code" != "204" ]; then cat /tmp/dispatch.log; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
