# ============================================================
#  Python and Big Data in Economics — clean MkDocs Material config
#  Static site only. Deploys to GitHub Pages.
#  No Flask / Node / nginx backends required.
# ============================================================

site_name: Python and Big Data in Economics
site_description: A hands-on introduction to Python and big data for economics.
copyright: |
  © 2025–2026 Guoliang Ma (马国良). All rights reserved · 保留所有权利
  <br>
  <a href="http://beian.miit.gov.cn/" target="_blank" rel="noopener">鲁ICP备2026038759号</a>

# The canonical address of the course. This is the ONLY place the public URL is
# written down, and it decides two things in the build:
#   1. the <link rel="canonical"> on every page — what search engines index;
#   2. the language switcher on the two HOMEPAGES, which the i18n plugin emits as
#      absolute paths (/teaching/py101/ and /teaching/py101/zh/). Everything else
#      MkDocs writes is relative.
#
# The same build is served from three places, and only the first matches this URL:
#   - https://www.maguoliang.com/teaching/py101/   <- canonical (personal site)
#   - https://glma-xmu.github.io/py101/            <- GitHub Pages, source of truth
#   - https://maguoliang.cn/                       <- Aliyun mirror, at the root
# javascripts/lang-switch-fix.js repairs (2) at load time on the other two, so one
# build works everywhere. See SERVER_DEPLOY.md.
site_url: https://www.maguoliang.com/teaching/py101/

theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  features:
    - navigation.tracking
    - navigation.footer
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: memory
          class: memory-diagram
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: motto
          class: epigraph
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: recall
          class: callback
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: terminal
          class: terminal-widget
          format: !!python/name:pymdownx.superfences.fence_div_format
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 中文
          build: true
          site_name: 经济学中的 Python 与大数据
          nav_translations:
            "Home": 首页
            "Chapter 1: Python Basics": 第1章：Python 基础
            "1.1 Objects and Types": 1.1 对象与类型
            "1.2 Collections": 1.2 容器集合
            "1.3 Control Flow": 1.3 控制流程
            "1.4 Iterables and Iterators": 1.4 可迭代对象
            "Chapter 2: Functions": 第2章：函数
            "2.1 Defining Functions": 2.1 定义函数
            "2.2 Namespaces and Scope": 2.2 命名空间与作用域
            "2.3 First-Class Objects": 2.3 函数是一等对象
            "2.4 Use Cases": 2.4 实践用例
            "2.5 Loose Ends and Style": 2.5 补遗与风格
            "Chapter 3: NumPy & pandas": 第3章：NumPy 与 pandas
            "3.1 NumPy": 3.1 NumPy
            "3.2 pandas: One Table": 3.2 pandas：单表操作
            "3.3 pandas: Reshape and Group": 3.3 pandas：重塑与分组
            "3.4 pandas: Combining Tables": 3.4 pandas：多表合并
            "Exercises": 习题
            "Chapter 1 — Python Basics": 第 1 章 — Python 基础
            "Chapter 2 — Functions": 第 2 章 — 函数
            "Appendix": 附录
            "A1 Python Environment Setup": A1 Python 环境搭建
            "A2 Command Line and Paths": A2 命令行与路径
            "Two-Day Crash Course": 两日强化班
            "Overview and Schedule": 概览与日程
            "1. Style and Error Messages": 1. 代码风格与报错信息
            "2. Environments and Tooling": 2. 虚拟环境与工具链
            "3. Names, Expressions, Statements": 3. 名字、表达式与语句
            "4. Functions": 4. 函数
            "5. Object-Oriented Python": 5. 面向对象的 Python
            "6. Data Manipulation with pandas": 6. 用 pandas 处理数据
            "7. Making Python Fast": 7. 让 Python 跑得更快
            "Copyright": 版权声明

# NOTE: the ?v= suffixes are cache busters. Material does not fingerprint
# extra_css/extra_javascript, so these URLs never change on their own and a
# returning student keeps whatever their browser cached — which shows up as a
# page whose HTML and JS are new but whose styling is old. Bump the number
# whenever you edit one of these files.
extra_css:
  - stylesheets/extra.css?v=2
  - vendor/katex/katex.min.css

extra_javascript:
  - javascripts/lang-switch-fix.js?v=1
  - javascripts/main-site-link.js
  - javascripts/runnable.js?v=3
  - javascripts/shell.js?v=1
  - javascripts/memory-diagram.js
  - javascripts/reading-mode.js
  - javascripts/ask-button.js
  - javascripts/katex.js
  - vendor/katex/katex.min.js
  - vendor/katex/auto-render.min.js
  # NOTE: The old AI-chat (chat.js), auto-grading (grading.js) and
  # live-translation (translation-button.js) scripts were intentionally
  # left out — they require backend servers that don't run on GitHub Pages.
  # Re-add them once a serverless backend is wired up.

nav:
  - Home: index.md
  - "Chapter 1: Python Basics":
      - 1.1 Objects and Types: py101_md/ch1_1_objects.md
      - 1.2 Collections: py101_md/ch1_2_collections.md
      - 1.3 Control Flow: py101_md/ch1_3_control_flow.md
      - 1.4 Iterables and Iterators: py101_md/ch1_4_iterators.md
  - "Chapter 2: Functions":
      - 2.1 Defining Functions: py101_md/ch2_1_defining_functions.md
      - 2.2 Namespaces and Scope: py101_md/ch2_2_namespaces_scope.md
      - 2.3 First-Class Objects: py101_md/ch2_3_first_class.md
      - 2.4 Use Cases: py101_md/ch2_4_use_cases.md
      - 2.5 Loose Ends and Style: py101_md/ch2_5_loose_ends.md
  - "Chapter 3: NumPy & pandas":
      - 3.1 NumPy: py101_md/ch3_1_numpy.md
      - "3.2 pandas: One Table": py101_md/ch3_2_pandas.md
      - "3.3 pandas: Reshape and Group": py101_md/ch3_3_reshape_group.md
      - "3.4 pandas: Combining Tables": py101_md/ch3_4_merge.md
  - "Exercises":
      - "Chapter 1 — Python Basics": py101_md/exercises_ch1.md
      - "Chapter 2 — Functions": py101_md/exercises_ch2.md
  - "Appendix":
      - "A1 Python Environment Setup": py101_md/appendix_a1_environment.md
      - "A2 Command Line and Paths": py101_md/appendix_a2_shell.md
  # The two-day graduate crash course. Self-contained, and numbered as it was
  # taught (1.1, 3.2.1, "Example 5.7", ...) so the existing lecture recordings
  # still line up. That is why its numbering restarts here and does not follow
  # the per-page scheme used by the chapters above.
  - "Two-Day Crash Course":
      - "Overview and Schedule": py101_md/camp_index.md
      - "1. Style and Error Messages": py101_md/camp_ch1_style.md
      - "2. Environments and Tooling": py101_md/camp_ch2_environments.md
      - "3. Names, Expressions, Statements": py101_md/camp_ch3_names.md
      - "4. Functions": py101_md/camp_ch4_functions.md
      - "5. Object-Oriented Python": py101_md/camp_ch5_oop.md
      - "6. Data Manipulation with pandas": py101_md/camp_ch6_pandas.md
      - "7. Making Python Fast": py101_md/camp_ch7_performance.md
  - Copyright: copyright.md
  # More chapters and exercise sets are added here as each is rewritten.
  # Backups of the original files remain in docs/py101_md (slide_*, Lecture_*).
